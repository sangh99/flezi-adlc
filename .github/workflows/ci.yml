name: CI

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid CLAUDE.md
        run: |
          found=$(find . -path ./node_modules -prune -o -path '*/node_modules' -prune -o -path ./.git -prune -o \( -name CLAUDE.md -o -name CLAUDE.local.md \) -print)
          if [ -n "$found" ]; then
            echo "::error::AGENTS.md is the only instructions file; a CLAUDE.md stops Claude Code from reading AGENTS.md. Remove:"
            echo "$found"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test
